  canvas{display:block;width:100%;height:100%}

  #ui{
    position:absolute;inset:0;
    pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;flex-direction:column;align-items:center;
    color:var(--bone);
  }

  #score{
    font-size:64px;font-weight:600;
    letter-spacing:-0.04em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 4px rgba(0,0,0,.35);
    opacity:0;transition:opacity .18s;
  }
  body[data-state="playing"] #score{opacity:1}

  #panel{
    margin:auto;text-align:center;max-width:20rem;
    opacity:0;transform:translateY(6px);
    transition:opacity .22s ease,transform .22s ease;
  }
  body[data-state="ready"] #panel,
  body[data-state="over"] #panel{opacity:1;transform:none}

  #title{
    font-size:44px;font-weight:700;letter-spacing:-0.045em;
    text-shadow:0 2px 4px rgba(0,0,0,.32);
  }
  #sub{
    margin-top:10px;font-size:16px;opacity:.82;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }

  #card{
    background:var(--ink);border-radius:18px;
    padding:22px 26px 20px;display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
  }
  body[data-state="over"] #card{display:block}
  body[data-state="over"] #title,
  body[data-state="over"] #sub{display:none}

  #card .final{font-size:56px;font-weight:600;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1}
  #card .flag{margin-top:8px;font-size:14px;color:#E9C77E;height:17px}
  #card .best{
    margin-top:14px;padding-top:14px;
    border-top:1px solid rgba(239,230,214,.22);
    font-size:15px;opacity:.8;font-variant-numeric:tabular-nums;
  }
  #card .again{margin-top:16px;font-size:15px;opacity:.55}

  #bestLine{
    position:absolute;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom) + 22px);
    text-align:center;font-size:15px;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
    opacity:0;transition:opacity .2s;
  }
  body[data-state="ready"] #bestLine{opacity:.85}

  #warn{
    position:absolute;left:16px;right:16px;
    bottom:calc(env(safe-area-inset-bottom) + 4px);
    text-align:center;font-size:12px;line-height:1.4;
    opacity:.7;display:none;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
  }
</style>
</head>
<body data-state="ready">
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="panel">
      <div id="title">Windward</div>
      <div id="sub">Tap anywhere to fly. Thread the stacks.</div>
      <div id="card">
        <div class="final" id="finalScore">0</div>
        <div class="flag" id="flag"></div>
        <div class="best" id="cardBest">Best 0</div>
        <div class="again">Tap to fly again</div>
      </div>
    </div>
    <div id="bestLine">Best 0</div>
    <div id="warn"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- saved data ---------- */
const KEY = 'windward.best';
let best = 0;
let storageWorks = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw !== null) best = parseInt(raw, 10) || 0;
} catch (e) { storageWorks = false; }

function saveBest(){
  try { localStorage.setItem(KEY, String(best)); }
  catch (e) { storageWorks = false; showWarn(); }
}
function showWarn(){
  const w = document.getElementById('warn');
  w.style.display = 'block';
  w.textContent = 'This preview blocks local storage, so the best score will not survive a reload. Host the file and it will.';
}
if (!storageWorks) showWarn();

/* ---------- sound ---------- */
let actx = null, noise = null;

function initAudio(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { return; }
  const n = Math.floor(actx.sampleRate * 0.3);
  noise = actx.createBuffer(1, n, actx.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
}

function flapSound(){
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();
  const t = actx.currentTime;

  // air moving over the wing: filtered noise sweeping downward
  const src = actx.createBufferSource();
  src.buffer = noise;
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.15;
  bp.frequency.setValueAtTime(1600, t);
  bp.frequency.exponentialRampToValueAtTime(330, t + 0.15);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.26, t + 0.018);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t + 0.22);

  // a little body to the downstroke
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(230, t);
  o.frequency.exponentialRampToValueAtTime(118, t + 0.1);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.09, t + 0.012);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(og); og.connect(actx.destination);
  o.start(t); o.stop(t + 0.15);
}

/* ---------- themes ---------- */
const THEMES = [
  {
    sky:['#6E9AB0','#B9CBD1'],
    orb:{x:0.78, y:0.15, r:0.11, color:'#F2E6CC', alpha:0.85},
    cloud:'#CFDDE1', cloudAlpha:0.55,
    sea:'#2E4A55', seaLine:'#4A6D77', shore:'#1B2E37',
    rockLit:'#EFE6D6', rockShade:'#C9B79B',
    ink:'#1B2E37', gull:'#FBF7EF', wing:'#DCD2C0', beak:'#E0A03C',
    stars:0
  },
  {
    sky:['#464C82','#C4696B','#F3B270'],
    orb:{x:0.72, y:0.56, r:0.155, color:'#FBE0A2', alpha:0.92},
    cloud:'#5B4A72', cloudAlpha:0.5,
    sea:'#22303F', seaLine:'#3C5266', shore:'#151E2C',
    rockLit:'#E6D0B4', rockShade:'#9E7A58',
    ink:'#151E2C', gull:'#FCEFDD', wing:'#D6BC9E', beak:'#E0A03C',
    stars:0
  },
  {
    sky:['#0D1930','#20375A'],
    orb:{x:0.75, y:0.13, r:0.072, color:'#E9E5D9', alpha:0.95},
    cloud:'#2B3F5E', cloudAlpha:0.45,
    sea:'#070F1C', seaLine:'#1A3049', shore:'#2A4463',
    rockLit:'#4C5C72', rockShade:'#2C3A4E',
    ink:'#08111F', gull:'#E9EFF6', wing:'#B4C3D2', beak:'#C88A3E',
    stars:70
  }
];

let themeIndex = 0;
let C = THEMES[0];

function applyTheme(){
  C = THEMES[themeIndex];
  document.documentElement.style.background = C.sky[0];
  document.body.style.background = C.sky[0];
  document.documentElement.style.setProperty('--ink', C.ink);
  const m = document.getElementById('themeColor');
  if (m) m.setAttribute('content', C.sky[0]);
  buildGrad();
  makeStars();
}

/* ---------- canvas ---------- */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
let W = 0, H = 0;
let R, GRAV, FLAP, SPEED, GAP, PW, SPACING, seaY, birdX, skyGrad;

function buildGrad(){
  if (!seaY) return;
  skyGrad = ctx.createLinearGradient(0, 0, 0, seaY);
  const n = C.sky.length - 1;
  C.sky.forEach((col, i) => skyGrad.addColorStop(i / n, col));
}

function metrics(){
  seaY    = H * 0.86;
  R       = Math.max(9, H * 0.020);
  GRAV    = H * 1.95;
  FLAP    = -H * 0.56;
  SPEED   = Math.max(150, W * 0.42);
  GAP     = Math.max(H * 0.27, R * 8.5);
  PW      = Math.min(Math.max(W * 0.16, 44), 78);
  SPACING = Math.max(W * 0.68, 210);
  birdX   = W * 0.30;
  buildGrad();
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = cvs.clientWidth;
  H = cvs.clientHeight;
  cvs.width  = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  metrics();
  makeStars();
  if (state !== 'playing') reset();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- world ---------- */
let state = 'ready';
let score = 0;
let bird = { y:0, v:0, wing:1 };
let stacks = [], clouds = [], ripples = [], stars = [];
let bobT = 0, overAge = 0;

function setState(s){
  state = s;
  document.body.dataset.state = s;
}

function makeStars(){
  stars = [];
  if (!C.stars || !W) return;
  for (let i = 0; i < C.stars; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (seaY * 0.82),
      r: Math.random() * 1.3 + 0.5,
      p: Math.random() * TAU,
      s: 0.6 + Math.random() * 1.6
    });
  }
}

function reset(){
  score = 0;
  document.getElementById('score').textContent = '0';
  bird.y = seaY * 0.45;
  bird.v = 0;
  bird.wing = 1;

  stacks = [];
  let x = W + SPACING * 0.4;
  for (let i = 0; i < 4; i++){ stacks.push(makeStack(x)); x += SPACING; }

  clouds = [];
  for (let i = 0; i < 5; i++){
    clouds.push({
      x: Math.random() * W * 1.4,
      y: H * (0.06 + Math.random() * 0.32),
      w: W * (0.18 + Math.random() * 0.26),
      h: H * 0.016
    });
  }

  ripples = [];
  for (let i = 0; i < 9; i++){
    ripples.push({
      x: Math.random() * W,
      y: seaY + (H - seaY) * (0.15 + Math.random() * 0.7),
      w: W * (0.05 + Math.random() * 0.09)
    });
  }

  updateBestLabels();
  setState('ready');
}

function nextRound(){
  themeIndex = (themeIndex + 1) % THEMES.length;
  applyTheme();
  reset();
}

function makeStack(x){
  const margin = GAP / 2 + R * 3;
  const gy = margin + Math.random() * Math.max(1, seaY - margin * 2);
  return { x: x, gy: gy, scored: false };
}

function flap(){
  if (state === 'ready'){ setState('playing'); bird.v = FLAP; bird.wing = 0; flapSound(); return; }
  if (state === 'playing'){ bird.v = FLAP; bird.wing = 0; flapSound(); return; }
  if (state === 'over' && overAge > 0.6){
    nextRound();
    setState('playing');
    bird.v = FLAP; bird.wing = 0;
    flapSound();
  }
}

function die(){
  setState('over');
  overAge = 0;
  const isBest = score > best;
  if (isBest){ best = score; saveBest(); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('flag').textContent = isBest && score > 0 ? 'New best' : '';
  document.getElementById('cardBest').textContent = 'Best ' + best;
  updateBestLabels();
}

function updateBestLabels(){
  document.getElementById('bestLine').textContent = 'Best ' + best;
}

/* ---------- input ---------- */
function onDown(e){ e.preventDefault(); initAudio(); flap(); }
window.addEventListener('pointerdown', onDown, { passive:false });
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); initAudio(); flap(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- update ---------- */
function update(dt){
  bird.wing = Math.min(1, bird.wing + dt * 4.2);
  for (const s of stars) s.p += dt * s.s;

  if (state === 'ready'){
    bobT += dt;
    bird.y = seaY * 0.45 + Math.sin(bobT * 2) * R * 0.9;
    scrollBackground(dt, 1);
    return;
  }

  if (state === 'over'){
    overAge += dt;
    bird.v += GRAV * dt;
    bird.y += bird.v * dt;
    if (bird.y > seaY - R){ bird.y = seaY - R; bird.v = 0; }
    return;
  }

  const rate = 1 + Math.min(score * 0.013, 0.45);
  const dx = SPEED * rate * dt;

  bird.v += GRAV * dt;
  bird.y += bird.v * dt;
  if (bird.y < R){ bird.y = R; bird.v = 0; }
  if (bird.y > seaY - R){ bird.y = seaY - R; die(); return; }

  scrollBackground(dt, rate);

  for (const s of stacks){
    s.x -= dx;
    if (!s.scored && s.x + PW < birdX){
      s.scored = true; score++;
      document.getElementById('score').textContent = score;
    }
    if (hits(s)){ die(); return; }
  }

  while (stacks.length && stacks[0].x + PW < -20) stacks.shift();
  const last = stacks[stacks.length - 1];
  if (last && last.x < W - SPACING) stacks.push(makeStack(last.x + SPACING));
}

function scrollBackground(dt, rate){
  const dx = SPEED * rate * dt;
  for (const c of clouds){
    c.x -= dx * 0.13;
    if (c.x + c.w < 0){ c.x = W + Math.random() * W * 0.4; c.y = H * (0.06 + Math.random() * 0.32); }
  }
  for (const s of stars){
    s.x -= dx * 0.035;
    if (s.x < -2){ s.x = W + 2; s.y = Math.random() * (seaY * 0.82); }
  }
  for (const r of ripples){
    r.x -= dx * 0.35;
    if (r.x + r.w < 0) r.x = W + Math.random() * W * 0.3;
  }
}

function hits(s){
  const topH = s.gy - GAP / 2;
  const botY = s.gy + GAP / 2;
  if (birdX + R < s.x || birdX - R > s.x + PW) return false;
  return (bird.y - R < topH) || (bird.y + R > botY);
}

/* ---------- render ---------- */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw(){
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, seaY);

  // stars
  if (stars.length){
    ctx.fillStyle = '#F4F6FB';
    for (const s of stars){
      ctx.globalAlpha = 0.35 + Math.sin(s.p) * 0.28 + 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // sun or moon
  const o = C.orb;
  ctx.fillStyle = o.color;
  ctx.globalAlpha = o.alpha;
  ctx.beginPath();
  ctx.arc(W * o.x, H * o.y, Math.min(W, H) * o.r, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  // clouds
  ctx.fillStyle = C.cloud;
  ctx.globalAlpha = C.cloudAlpha;
  for (const c of clouds){ roundRect(c.x, c.y, c.w, c.h, c.h / 2); ctx.fill(); }
  ctx.globalAlpha = 1;

  // sea
  ctx.fillStyle = C.sea;
  ctx.fillRect(0, seaY, W, H - seaY);
  ctx.fillStyle = C.seaLine;
  ctx.globalAlpha = 0.55;
  for (const r of ripples){ roundRect(r.x, r.y, r.w, 3, 1.5); ctx.fill(); }
  ctx.globalAlpha = 1;

  for (const s of stacks) drawStack(s);

  ctx.strokeStyle = C.shore;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, seaY);
  ctx.lineTo(W, seaY);
  ctx.stroke();

  drawGull();
}

function drawStack(s){
  const topH = s.gy - GAP / 2;
  const botY = s.gy + GAP / 2;
  const lw = Math.max(2, PW * 0.045);
  ctx.lineWidth = lw;
  ctx.strokeStyle = C.ink;

  const column = (y, h) => {
    if (h <= 0) return;
    ctx.fillStyle = C.rockLit;
    ctx.fillRect(s.x, y, PW, h);
    ctx.fillStyle = C.rockShade;
    ctx.fillRect(s.x + PW * 0.58, y, PW * 0.42, h);
    ctx.strokeRect(s.x + lw / 2, y - lw, PW - lw, h + lw * 2);
  };
  const cap = (y, h) => {
    const cx = s.x - PW * 0.09, cw = PW * 1.18;
    ctx.fillStyle = C.rockLit;
    ctx.fillRect(cx, y, cw, h);
    ctx.fillStyle = C.rockShade;
    ctx.fillRect(cx + cw * 0.58, y, cw * 0.42, h);
    ctx.strokeRect(cx + lw / 2, y + lw / 2, cw - lw, h - lw);
  };

  const capH = Math.max(10, PW * 0.22);
  column(-lw, topH - capH + lw);
  cap(topH - capH, capH);
  cap(botY, capH);
  column(botY + capH, seaY - botY - capH);
}

function drawGull(){
  const rot = Math.max(-0.5, Math.min(0.95, bird.v / (H * 1.05)));
  const r = R;
  ctx.save();
  ctx.translate(birdX, bird.y);
  ctx.rotate(state === 'ready' ? -0.12 : rot);
  ctx.lineWidth = Math.max(1.6, r * 0.17);
  ctx.strokeStyle = C.ink;
  ctx.lineJoin = 'round';

  ctx.fillStyle = C.gull;
  ctx.beginPath();
  ctx.moveTo(-r * 1.0, -r * 0.15);
  ctx.lineTo(-r * 2.1, -r * 0.55);
  ctx.lineTo(-r * 1.0, r * 0.4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.35, r * 0.86, 0, 0, TAU);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.beak;
  ctx.beginPath();
  ctx.moveTo(r * 1.15, -r * 0.08);
  ctx.lineTo(r * 2.05, r * 0.14);
  ctx.lineTo(r * 1.1, r * 0.4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = C.ink;
  ctx.beginPath();
  ctx.arc(r * 0.62, -r * 0.22, r * 0.15, 0, TAU);
  ctx.fill();

  const t = 1 - Math.pow(1 - bird.wing, 2);
  const wa = 0.9 + (-0.45 - 0.9) * t;
  ctx.save();
  ctx.translate(-r * 0.1, -r * 0.1);
  ctx.rotate(wa);
  ctx.fillStyle = C.wing;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.5, -r * 1.0, r * 1.85, -r * 0.45);
  ctx.quadraticCurveTo(r * 0.9, r * 0.45, -r * 0.25, r * 0.25);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

/* ---------- loop ---------- */
let prev = 0;
function frame(now){
  if (!prev) prev = now;
  const dt = Math.min((now - prev) / 1000, 1 / 30);
  prev = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
applyTheme();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
